name: Deploy Student Frontend

on:
  push:
    branches:
      - frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frontend branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        env:
          NEXT_PUBLIC_TENANT_URL: ${{ vars.NEXT_PUBLIC_TENANT_URL }}
          NEXT_PUBLIC_ROOT_DOMAIN: ${{ vars.NEXT_PUBLIC_ROOT_DOMAIN }}
          NEXT_PUBLIC_DEV_DOMAIN: ${{ vars.NEXT_PUBLIC_DEV_DOMAIN }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ vars.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_WHATSPHONE: ${{ vars.NEXT_PUBLIC_WHATSPHONE }}
        run: npm run build

      - name: Test SSH connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            whoami
            pwd
            echo "SSH connection successful"

      - name: Remove old .next from server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd /home/nir/public_html/student.nir-edu.com
            rm -rf .next
            mkdir -p .next

      - name: Upload build files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: ".next,public,package.json,package-lock.json,next.config.js"
          target: "/home/nir/public_html/student.nir-edu.com"
          overwrite: true

      - name: Install production dependencies and reload PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            export HOME="/home/nir"
            export PM2_HOME="/home/nir/.pm2"
            export NPM_CONFIG_CACHE="/home/nir/.npm"
            export PATH="/opt/cpanel/ea-nodejs20/bin:/usr/local/bin:/usr/bin:/bin:$PATH"

            cd /home/nir/public_html/student.nir-edu.com

            echo "User:"
            whoami

            echo "HOME:"
            echo $HOME

            echo "PM2_HOME:"
            echo $PM2_HOME

            echo "Node:"
            which node
            node -v

            echo "NPM:"
            which npm
            npm -v

            echo "PM2:"
            which pm2
            pm2 -v

            npm ci --omit=dev --cache /home/nir/.npm

            pm2 reload student-nir-edu --update-env
            pm2 save